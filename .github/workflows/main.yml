name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: 'Check 🐱'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup 👨🏻‍💻
        uses: ./.github/actions/setup

      - name: Check JS files 🐱
        run: bun run check

      - name: Check Rust formatting 🦀
        run: bun run format:rust

  typecheck:
    name: 'Typecheck 🔍'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup 👨🏻‍💻
        uses: ./.github/actions/setup

      - name: Typecheck 🔍
        run: bun run typecheck

  build:
    name: 'Build 🏗'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup 👨🏻‍💻
        uses: ./.github/actions/setup

      - name: Build 🏗
        run: bun run build

  unit-tests:
    name: 'Unit Tests 🧪'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup 👨🏻‍💻
        uses: ./.github/actions/setup

      - name: Unit Tests 🧪
        run: bun run test

  integration-tests:
    name: 'Integration Tests 🧪'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tessera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d tessera_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup 👨🏻‍💻
        uses: ./.github/actions/setup

      - name: API Integration Tests 🧪
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/tessera_test
        run: bun run --filter @repo/api test:integration

  e2e-tests:
    name: 'E2E Tests 🧪'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tessera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d tessera_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup 👨🏻‍💻
        uses: ./.github/actions/setup

      - name: Git E2E Tests 🧪
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/tessera_test
          REDIS_URL: redis://localhost:6379
        run: bun run test:e2e:git

  security-audit:
    name: 'Security Audit 🛡'
    runs-on: ubuntu-latest
    # Advisory reporting only. These steps surface known vulnerabilities for
    # reachability triage; they intentionally do NOT fail CI purely on raw
    # advisory counts. Confirmed, reachable advisories should be remediated
    # (or explicitly ignored with justification) rather than auto-blocking.
    permissions:
      contents: read
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup 👨🏻‍💻
        uses: ./.github/actions/setup

      - name: JS dependency audit (bun) 🛡
        shell: bash
        run: |
          set +e
          {
            echo "## JS dependency audit (\`bun audit\`)"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          bun audit 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=JS advisories reported::bun audit found advisories — triage reachability before acting; not a hard failure."
          fi
          # Do not gate on raw advisory counts.
          exit 0

      - name: Install cargo-audit 🦀
        shell: bash
        run: cargo install cargo-audit --locked

      - name: Rust dependency audit (cargo) 🦀
        shell: bash
        run: |
          set +e
          {
            echo "## Rust dependency audit (\`cargo audit\`)"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo audit 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Rust advisories reported::cargo audit found advisories — triage reachability before acting; not a hard failure."
          fi
          # Do not gate on raw advisory counts.
          exit 0
