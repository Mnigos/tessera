syntax = "proto3";

package tessera.git.v1;

service GitStorageService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc CreateRepository(CreateRepositoryRequest) returns (CreateRepositoryResponse);
  rpc ImportRepository(ImportRepositoryRequest) returns (ImportRepositoryResponse);
  rpc PushRepositoryMirror(PushRepositoryMirrorRequest) returns (PushRepositoryMirrorResponse);
  rpc ListRepositoryRefs(ListRepositoryRefsRequest) returns (ListRepositoryRefsResponse);
  rpc GetRepositoryBrowserSummary(GetRepositoryBrowserSummaryRequest) returns (GetRepositoryBrowserSummaryResponse);
  rpc GetRepositoryTree(GetRepositoryTreeRequest) returns (GetRepositoryTreeResponse);
  rpc GetRepositoryBlob(GetRepositoryBlobRequest) returns (GetRepositoryBlobResponse);
  rpc GetRepositoryRawBlob(GetRepositoryRawBlobRequest) returns (GetRepositoryRawBlobResponse);
  rpc ListRepositoryCommits(ListRepositoryCommitsRequest) returns (ListRepositoryCommitsResponse);
  rpc CompareRepositoryRefs(CompareRepositoryRefsRequest) returns (CompareRepositoryRefsResponse);
  rpc GetRepositoryFileDiff(GetRepositoryFileDiffRequest) returns (GetRepositoryFileDiffResponse);
  rpc MergeRepositoryRefs(MergeRepositoryRefsRequest) returns (MergeRepositoryRefsResponse);
  rpc CheckRepositoryMergeability(CheckRepositoryMergeabilityRequest) returns (CheckRepositoryMergeabilityResponse);
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
}

message CreateRepositoryRequest {
  string repository_id = 1;
}

message CreateRepositoryResponse {
  string storage_path = 1;
}

message ImportRepositoryRequest {
  string repository_id = 1;
  string storage_path = 2;
  string source_url = 3;
  optional string access_token = 4;
  string default_branch_hint = 5;
}

message ImportRepositoryResponse {
  string default_branch = 1;
  string storage_path = 2;
}

message PushRepositoryMirrorRequest {
  string repository_id = 1;
  string storage_path = 2;
  string target_url = 3;
  optional string access_token = 4;
}

message PushRepositoryMirrorResponse {
  bool success = 1;
}

message ListRepositoryRefsRequest {
  string repository_id = 1;
  string storage_path = 2;
  repeated TrustedGpgKey trusted_gpg_keys = 3;
}

message ListRepositoryRefsResponse {
  repeated RepositoryRef refs = 1;
}

message GetRepositoryBrowserSummaryRequest {
  string repository_id = 1;
  string storage_path = 2;
  string default_branch = 3;
  string ref = 4;
}

message GetRepositoryBrowserSummaryResponse {
  bool is_empty = 1;
  string default_branch = 2;
  repeated RepositoryTreeEntry root_entries = 3;
  RepositoryReadme readme = 4;
}

message GetRepositoryTreeRequest {
  string repository_id = 1;
  string storage_path = 2;
  string ref = 3;
  string path = 4;
}

message GetRepositoryTreeResponse {
  string commit_id = 1;
  string path = 2;
  repeated RepositoryTreeEntry entries = 3;
}

message GetRepositoryBlobRequest {
  string repository_id = 1;
  string storage_path = 2;
  string object_id = 3;
}

message GetRepositoryBlobResponse {
  string object_id = 1;
  RepositoryBlobPreviewState state = 2;
  string text = 3;
  uint64 size_bytes = 4;
  uint64 preview_limit_bytes = 5;
}

message GetRepositoryRawBlobRequest {
  string repository_id = 1;
  string storage_path = 2;
  string object_id = 3;
}

message GetRepositoryRawBlobResponse {
  string object_id = 1;
  bytes content = 2;
  uint64 size_bytes = 3;
}

message ListRepositoryCommitsRequest {
  string repository_id = 1;
  string storage_path = 2;
  string ref = 3;
  uint32 limit = 4;
  repeated TrustedGpgKey trusted_gpg_keys = 5;
}

message ListRepositoryCommitsResponse {
  repeated RepositoryCommit commits = 1;
}

message CompareRepositoryRefsRequest {
  string repository_id = 1;
  string storage_path = 2;
  string base_ref = 3;
  string head_ref = 4;
}

message CompareRepositoryRefsResponse {
  string base_sha = 1;
  string head_sha = 2;
  string merge_base_sha = 3;
  repeated RepositoryComparisonCommit commits = 4;
  repeated RepositoryChangedFile files = 5;
  bool is_truncated = 6;
  uint32 file_limit = 7;
  bool commits_truncated = 8;
  uint32 commit_limit = 9;
}

message GetRepositoryFileDiffRequest {
  string repository_id = 1;
  string storage_path = 2;
  string base_ref = 3;
  string head_ref = 4;
  string path = 5;
}

message GetRepositoryFileDiffResponse {
  string base_sha = 1;
  string head_sha = 2;
  string merge_base_sha = 3;
  RepositoryChangedFile file = 4;
  repeated RepositoryDiffHunk hunks = 5;
  bool is_truncated = 6;
  uint64 patch_limit_bytes = 7;
}

message MergeRepositoryRefsRequest {
  string repository_id = 1;
  string storage_path = 2;
  string base_ref = 3;
  string head_ref = 4;
  string expected_base_sha = 5;
  string expected_head_sha = 6;
  string author_name = 7;
  string author_email = 8;
  string message = 9;
  string operation_id = 10;
}

message MergeRepositoryRefsResponse {
  string merge_commit_sha = 1;
}

message CheckRepositoryMergeabilityRequest {
  string repository_id = 1;
  string storage_path = 2;
  string base_ref = 3;
  string head_ref = 4;
}

message CheckRepositoryMergeabilityResponse {
  bool mergeable = 1;
  string base_sha = 2;
  string head_sha = 3;
  string merge_base_sha = 4;
  repeated string conflict_paths = 5;
  bool conflict_paths_truncated = 6;
  uint32 conflict_path_limit = 7;
}

message RepositoryComparisonCommit {
  string sha = 1;
  string short_sha = 2;
  string summary = 3;
  RepositoryCommitIdentity author = 4;
}

message RepositoryChangedFile {
  RepositoryChangedFileStatus status = 1;
  string old_path = 2;
  string new_path = 3;
  string base_blob_id = 4;
  string head_blob_id = 5;
  uint32 additions = 6;
  uint32 deletions = 7;
  bool is_binary = 8;
}

message RepositoryDiffHunk {
  string header = 1;
  repeated RepositoryDiffLine lines = 2;
}

message RepositoryDiffLine {
  RepositoryDiffLineKind kind = 1;
  string content = 2;
  optional uint32 old_line = 3;
  optional uint32 new_line = 4;
}

enum RepositoryChangedFileStatus {
  REPOSITORY_CHANGED_FILE_STATUS_UNSPECIFIED = 0;
  REPOSITORY_CHANGED_FILE_STATUS_ADDED = 1;
  REPOSITORY_CHANGED_FILE_STATUS_MODIFIED = 2;
  REPOSITORY_CHANGED_FILE_STATUS_DELETED = 3;
  REPOSITORY_CHANGED_FILE_STATUS_RENAMED = 4;
}

enum RepositoryDiffLineKind {
  REPOSITORY_DIFF_LINE_KIND_UNSPECIFIED = 0;
  REPOSITORY_DIFF_LINE_KIND_CONTEXT = 1;
  REPOSITORY_DIFF_LINE_KIND_ADDITION = 2;
  REPOSITORY_DIFF_LINE_KIND_DELETION = 3;
}

message RepositoryCommit {
  string sha = 1;
  string short_sha = 2;
  string summary = 3;
  RepositoryCommitIdentity author = 4;
  RepositoryCommitIdentity committer = 5;
  RepositorySignature signature = 6;
}

message RepositoryCommitIdentity {
  string name = 1;
  string email = 2;
  string date = 3;
}

message RepositoryRef {
  RepositoryRefKind kind = 1;
  string display_name = 2;
  string qualified_name = 3;
  string commit_id = 4;
  bool is_default_branch = 5;
  RepositorySignature signature = 6;
}

message TrustedGpgKey {
  string key_id = 1;
  string fingerprint = 2;
  string public_key = 3;
}

message RepositorySignature {
  RepositorySignatureState state = 1;
  string key_id = 2;
  string fingerprint = 3;
  string primary_key_fingerprint = 4;
  string signer = 5;
}

enum RepositorySignatureState {
  REPOSITORY_SIGNATURE_STATE_UNSPECIFIED = 0;
  REPOSITORY_SIGNATURE_STATE_UNSIGNED = 1;
  REPOSITORY_SIGNATURE_STATE_VALID = 2;
  REPOSITORY_SIGNATURE_STATE_TRUSTED = 3;
  REPOSITORY_SIGNATURE_STATE_UNTRUSTED = 4;
  REPOSITORY_SIGNATURE_STATE_BAD = 5;
  REPOSITORY_SIGNATURE_STATE_UNKNOWN = 6;
  REPOSITORY_SIGNATURE_STATE_EXPIRED = 7;
  REPOSITORY_SIGNATURE_STATE_REVOKED = 8;
}

enum RepositoryRefKind {
  REPOSITORY_REF_KIND_UNSPECIFIED = 0;
  REPOSITORY_REF_KIND_BRANCH = 1;
  REPOSITORY_REF_KIND_TAG = 2;
}

message RepositoryTreeEntry {
  string name = 1;
  string object_id = 2;
  RepositoryTreeEntryKind kind = 3;
  uint64 size_bytes = 4;
  string path = 5;
  string mode = 6;
}

enum RepositoryTreeEntryKind {
  REPOSITORY_TREE_ENTRY_KIND_UNSPECIFIED = 0;
  REPOSITORY_TREE_ENTRY_KIND_FILE = 1;
  REPOSITORY_TREE_ENTRY_KIND_DIRECTORY = 2;
  REPOSITORY_TREE_ENTRY_KIND_SYMLINK = 3;
  REPOSITORY_TREE_ENTRY_KIND_SUBMODULE = 4;
}

message RepositoryReadme {
  string filename = 1;
  string object_id = 2;
  bytes content = 3;
  bool is_truncated = 4;
}

enum RepositoryBlobPreviewState {
  REPOSITORY_BLOB_PREVIEW_STATE_UNSPECIFIED = 0;
  REPOSITORY_BLOB_PREVIEW_STATE_TEXT = 1;
  REPOSITORY_BLOB_PREVIEW_STATE_BINARY = 2;
  REPOSITORY_BLOB_PREVIEW_STATE_TOO_LARGE = 3;
}
